name: Manufacturing Analytics CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore & Build API
      run: |
        dotnet restore ManufacturingMonitoring.API/ManufacturingMonitoring.API.csproj
        dotnet build ManufacturingMonitoring.API/ManufacturingMonitoring.API.csproj --no-restore -c Release

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Dashboard Frontend
      run: |
        cd manufacturing-monitoring-dashboard
        npm ci
        npm run build

    - name: Build Docker Container
      run: docker build -t mfg-monitoring-api:latest .
