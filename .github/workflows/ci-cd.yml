name: Manufacturing Analytics CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ManufacturingMonitoring.API/ManufacturingMonitoring.API.csproj

    - name: Build API
      run: dotnet build ManufacturingMonitoring.API/ManufacturingMonitoring.API.csproj --no-restore -c Release

    - name: Run xUnit Tests
      run: dotnet test ManufacturingMonitoring.Tests/ManufacturingMonitoring.Tests.csproj --no-build --verbosity normal

    - name: Build Docker Container
      run: docker build -t mfg-monitoring-api:latest .
